<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1000 1000" fill="none" role="img" aria-label="CheckIn">
  <title>CheckIn</title>
  <defs>
    <linearGradient id="ci-plate" x1="120" y1="50" x2="880" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E9CFF"/>
      <stop offset="0.44" stop-color="#5B6CF9"/>
      <stop offset="1" stop-color="#7449E0"/>
    </linearGradient>
    <radialGradient id="ci-glow" cx="300" cy="160" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ci-clip"><rect x="0" y="0" width="1000" height="1000" rx="225"/></clipPath>
  </defs>
  <g clip-path="url(#ci-clip)">
    <rect x="0" y="0" width="1000" height="1000" fill="url(#ci-plate)"/>
    <rect x="0" y="0" width="1000" height="1000" fill="url(#ci-glow)"/>
    <!-- 勾选长臂与钢笔共用笔尖端点 N，构成单一笔势 -->
    <path d="M412.67 646.91 L755.79 378.83" stroke="#FFFFFF" stroke-width="124.41" stroke-linecap="round"/>
    <path d="M190.12 379.09 L310.76 596.72 L412.67 646.91 L424.10 533.89 L303.47 316.26 A64.80 64.80 0 0 0 190.12 379.09 Z" fill="#FFFFFF"/>
  </g>
</svg>
