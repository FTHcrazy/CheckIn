<!doctype html>
<html lang="zh-CN" data-theme="mint">
<head>
<meta charset="utf-8">
<title>行囊窗口 · 大窗布局复刻</title>
<link rel="stylesheet" href="./preview/pack-preview.css">
<style>
  /* 真机 antd 的组件级外观是运行时 CSS-in-JS 生成的；静态页里只复刻
     这几行「组件读取的 --ant-* 变量」到属性的映射，正好也验证变量名没写错。 */
  * { -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0d13;
    color: var(--app-text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .win {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--app-bg);
    overflow: hidden;
  }
  .window-shell__body { flex: 1; min-height: 0; display: flex; }

  .ant-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--ant-button-icon-gap, 8px);
    height: var(--ant-control-height, 32px);
    padding-inline: var(--ant-button-padding-inline, 15px);
    font-size: var(--ant-button-content-font-size, 14px);
    font-weight: var(--ant-button-font-weight, 400);
    font-family: inherit;
    line-height: 1;
    border-radius: var(--ant-border-radius, 6px);
    border: var(--ant-line-width, 1px) var(--ant-line-type, solid) var(--ant-button-default-border-color, transparent);
    background: var(--ant-button-default-bg, transparent);
    color: var(--ant-button-default-color, inherit);
    box-shadow: var(--ant-button-default-shadow, none);
    box-sizing: border-box;
    cursor: pointer;
    white-space: nowrap;
  }
  .ant-switch {
    width: 30px; height: 16px; border-radius: 8px;
    background: var(--app-border-strong); position: relative; flex: none;
  }
  .ant-switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: #fff;
  }
  .ant-switch.is-on { background: var(--app-primary); }
  .ant-switch.is-on::after { left: auto; right: 2px; }
  .ant-input {
    height: var(--ant-control-height, 26px);
    padding-inline: var(--ant-input-padding-inline, 8px);
    font-family: inherit; font-size: var(--ant-input-input-font-size, 12px);
    border: 1px solid var(--app-border-strong);
    border-radius: var(--app-radius-item);
    background: var(--app-input-bg); color: var(--app-text);
  }

  /* 头部（未被本次改版触及，只复刻结构与量尺对齐） */
  .cpk-head__meta { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .cpk-head__realm {
    padding: 1px 6px; border-radius: var(--app-radius-pill);
    background: var(--app-primary-weak); color: var(--app-primary);
    font-weight: 600;
  }
  .cpk-head__bound { color: var(--app-text-muted); }
  .cpk-savebar__state {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--app-text-muted);
  }
  .cpk-savebar__dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--app-success);
  }
  .cpk-head__ops { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .cpk-head__tools { display: flex; align-items: center; gap: 2px; }
</style>
</head>
<body>
<div class="win">
  <header class="cpk-head is-idle">
    <div class="cpk-head__who">
      <span class="cpk-head__avatar">周</span>
      <div class="cpk-head__id">
        <button class="ant-btn cpk-head__name">周九</button>
        <div class="cpk-head__meta">
          <span class="cpk-head__realm">未命名角色</span>
          <span class="cpk-head__bound">已绑定主角</span>
        </div>
      </div>
    </div>
    <div class="cpk-head__ops">
      <span class="cpk-savebar__state is-dirty"><span class="cpk-savebar__dot"></span><span id="dirty">10 处改动未保存</span></span>
      <button class="ant-btn cpk-btn ghost">撤销全部</button>
      <button class="ant-btn cpk-btn primary">保存</button>
      <span class="cpk-head__tools">
        <button class="ant-btn cpk-iconbtn">{ }</button>
        <button class="ant-btn cpk-iconbtn">?</button>
        <button class="ant-btn cpk-iconbtn">⚙</button>
        <button class="ant-btn cpk-iconbtn">☰</button>
      </span>
    </div>
  </header>

  <div class="window-shell__body">
    <aside class="cpk" aria-label="行囊">
      <div class="cpk__body cpk__body--wide" data-tier="wide">
        <div class="cpk__content">
          <div class="cpk-board cpk-board--wide" id="board"></div>
          <div class="cpk__zones" id="zones"></div>
          <footer class="cpk__workfoot">
            <span>改动即存草稿 · 关窗前会提醒保存</span>
            <span class="cpk__workfoot-count" id="foot"></span>
          </footer>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const caseName = params.get("case") || "blank";
const tier = params.get("tier") || "wide";

const el = (html) => {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const entry = (text) => `<button class="ant-btn cpk-board__entry">${text}</button>`;

/* ── 概览带：四段 ── */
function boardHtml() {
  const attrs = caseName === "blank"
    ? `<p class="cpk-empty">还没有属性，去下方「人物属性」加一条</p>`
    : `<ul class="cpk-board__attrlist">
        ${[["气血", 100, 118, "+18"], ["攻击力", 62, 74, "+12"], ["防御力", 48, 48, ""], ["敏捷", 35, 41, "+6"], ["灵力", 210, 236, "+26"], ["悟性", 12, 12, ""]]
          .map(([name, base, fin, seg]) => `
          <li><button class="ant-btn cpk-board__attrrow">
            <span class="cpk-board__attrname">${name}</span>
            <span class="cpk-board__attrcalc">
              <span class="cpk-board__num">${base}</span>
              <span class="cpk-board__arrow">→</span>
              <span class="cpk-board__num is-final">${fin}</span>
            </span>
            <span class="cpk-board__seg">${seg ? `<em class="cpk-seg is-passive">${seg}</em>` : `<span class="cpk-board__none">无加成</span>`}</span>
          </button></li>`).join("")}
      </ul>`;

  const status = caseName === "blank"
    ? `<p class="cpk-empty">当前没有生效中的状态</p>`
    : `<ul class="cpk-board__statuslist">
        <li class="cpk-board__statusrow is-sustained">
          <span class="ant-switch is-on"></span>
          <span class="cpk-board__statusname">中毒</span>
          <span class="cpk-bdg is-sustained">持续</span>
          <span class="cpk-board__statusval">气血 −10</span>
        </li>
        <li class="cpk-board__statusrow is-passive">
          <span class="ant-switch is-on"></span>
          <span class="cpk-board__statusname">阵法增益</span>
          <span class="cpk-bdg is-passive">被动</span>
          <span class="cpk-board__statusval">灵力 +15%</span>
        </li>
      </ul>`;

  const mods = caseName === "blank"
    ? ["总属性汇总", "人物属性", "境界"]
    : ["总属性汇总", "人物属性", "境界", "装备栏", "物品栏", "技能栏"];

  return `
    <div class="cpk-board__col">
      <section class="cpk-board__card cpk-board__realm">
        <div class="cpk-board__rowhead">
          <span class="cpk-board__rowtitle">境界</span>
          ${caseName === "blank" ? "" : entry("调整")}
        </div>
        <div class="cpk-board__realmbig">${caseName === "blank" ? "未设置" : "筑基 2 层"}</div>
        <div class="cpk-board__mirror">
          <span class="cpk-board__mirrorlabel">实体面板显示</span>
          <span class="cpk-board__mirrorvalue">${caseName === "blank" ? "未设置" : "筑基 2 层"}</span>
          <span class="cpk-board__same">同源</span>
        </div>
      </section>
      <section class="cpk-board__card cpk-board__attrs">
        <div class="cpk-board__rowhead">
          <span class="cpk-board__rowtitle">核心属性</span>
          ${caseName === "blank" ? "" : entry("展开全部（6）")}
        </div>
        ${attrs}
      </section>
    </div>
    <div class="cpk-board__col">
      <section class="cpk-board__card cpk-board__status">
        <div class="cpk-board__rowhead">
          <span class="cpk-board__rowtitle">生效状态</span>
          <span class="cpk-board__count">${caseName === "blank" ? "0 项" : "2 项"}</span>
        </div>
        ${status}
      </section>
      <section class="cpk-board__card cpk-board__modules">
        <div class="cpk-board__rowhead">
          <span class="cpk-board__rowtitle">关键设定</span>
          ${entry("模块管理")}
        </div>
        <ul class="cpk-board__modlist">
          ${mods.map((m) => `
          <li><button class="ant-btn cpk-board__modrow">
            <span class="cpk-board__modlabel">${m}</span>
            <span class="cpk-board__modsum"></span>
            <span class="cpk-board__modarrow">›</span>
          </button></li>`).join("")}
        </ul>
      </section>
    </div>`;
}

/* ── 模块卡（PackModuleShell + 各模块空/实内容） ── */
function moduleCard(title, inner, actions = "") {
  return `
  <div class="cpk__module">
    <section class="cpk-mod">
      <header class="cpk-mod__head">
        <button class="ant-btn cpk-mod__toggle">
          <span class="cpk-mod__caret">▾</span>
          <span class="cpk-mod__title">${title}</span>
        </button>
        ${actions ? `<div class="cpk-mod__actions">${actions}</div>` : ""}
      </header>
      <div class="cpk-mod__wrap"><div class="cpk-mod__inner">${inner}</div></div>
    </section>
  </div>`;
}

const icoBtn = (t) => `<button class="ant-btn cpk-iconbtn">${t}</button>`;
const ghostBtn = (t) => `<button class="ant-btn cpk-btn ghost">${t}</button>`;

const summaryCard = () => moduleCard(
  "总属性汇总",
  `<p class="cpk-empty">还没有属性。先到「人物属性」加几项，或直接套用一个属性模板。</p>`,
  `${ghostBtn("编辑")}`,
);

const attrsCard = () => moduleCard(
  "人物属性",
  `<p class="cpk-empty">还没有属性。先套一套模板起步（力量 / 敏捷这类），也可以自己一条条加；装备和技能的加成再往上叠加。</p>
   <div class="cpk-emptyblock__actions" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
     ${ghostBtn("套用通用模板")}${ghostBtn("套用玄幻模板")}${ghostBtn("套用网游模板")}${ghostBtn("＋ 自建属性")}
   </div>`,
  `${ghostBtn("配置")}${ghostBtn("＋ 新增")}`,
);

const realmCard = () => moduleCard(
  "境界",
  `<p class="cpk-empty">这本书还没有等级体系。境界复用「设定中心」的等级序列（R25），先在那里建好阶梯，这里就能用了。</p>
   <div style="margin-top:8px"><button class="ant-btn cpk-btn primary">去设定中心创建</button></div>`,
  `${icoBtn("⚙")}`,
);

const equipmentCard = () => moduleCard(
  "装备栏",
  `<div class="cpk-emptyblock">
     <div style="display:flex;flex-direction:column;gap:6px">
       ${["武器 · 青锋剑", "护甲 · 玄铁甲", "饰品 · 空", "法宝 · 空"]
         .map((s) => `<div class="cpk-eq__row" style="display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--app-radius-item);background:var(--app-surface-alt)">
            <span class="cpk-eq__slotname" style="flex:1;font-size:12px">${s}</span>
            ${ghostBtn("换")}
         </div>`).join("")}
     </div>
   </div>`,
  `${ghostBtn("部位配置")}`,
);

const inventoryCard = () => moduleCard(
  "物品栏",
  `<div style="display:flex;flex-direction:column;gap:4px">
     ${[["回气丹", 12], ["凝神香", 3], ["符纸", 40], ["火折子", 2]]
       .map(([n, q]) => `<div style="display:flex;align-items:center;gap:8px;font-size:12px">
          <span class="cpk-dot" style="width:6px;height:6px;border-radius:50%;background:var(--app-accent-green)"></span>
          <span style="flex:1">${n}</span><span style="color:var(--app-text-muted)">×${q}</span>
       </div>`).join("")}
   </div>`,
  `${ghostBtn("＋ 物品")}`,
);

const skillsCard = () => moduleCard(
  "技能栏",
  `<p class="cpk-empty">还没有技能。加一条技能后可以给它的"熟练"绑定加成。</p>`,
  `${ghostBtn("＋ 技能")}`,
);

const ghostCard = () => `
  <button class="ant-btn cpk__zoneghost">
    <span class="cpk__zoneghost-line cpk__zoneghost-line--title">装备类模块都还没开</span>
    <span class="cpk__zoneghost-line">装备栏 / 物品栏 / 技能栏，点这里在「模块管理」里按需开启。</span>
  </button>`;

function zonesHtml() {
  if (tier !== "wide") {
    /* 中 / 窄档：单栏纵向流（窄档下次要模块折叠成标题行，这里只验版式） */
    return "";
  }
  if (caseName === "blank") {
    return `
      <section class="cpk__zone cpk__zone--stats cpk__zone--split">
        <header class="cpk__zonehead">
          <h3 class="cpk__zonetitle">数值与状态</h3>
          <span class="cpk__zonecount">3 个模块</span>
        </header>
        <div class="cpk__zonestack">
          <div class="cpk__zonecol">${summaryCard()}${attrsCard()}</div>
          <div class="cpk__zonecol">${realmCard()}${ghostCard()}</div>
        </div>
      </section>`;
  }
  return `
    <section class="cpk__zone cpk__zone--stats">
      <header class="cpk__zonehead">
        <h3 class="cpk__zonetitle">数值与状态</h3>
        <span class="cpk__zonecount">3 个模块</span>
      </header>
      <div class="cpk__zonestack">
        <div class="cpk__zonecol">${summaryCard()}${attrsCard()}${realmCard()}</div>
      </div>
    </section>
    <section class="cpk__zone cpk__zone--gear">
      <header class="cpk__zonehead">
        <h3 class="cpk__zonetitle">装备类</h3>
        <span class="cpk__zonecount">3 个模块</span>
      </header>
      <div class="cpk__zonestack">
        <div class="cpk__zonecol">${equipmentCard()}${inventoryCard()}${skillsCard()}</div>
      </div>
    </section>`;
}

document.getElementById("board").innerHTML = boardHtml();
document.getElementById("zones").innerHTML = zonesHtml();

if (tier !== "wide") {
  const body = document.querySelector(".cpk__body");
  body.className = `cpk__body cpk__body--${tier}`;
  body.dataset.tier = tier;
  document.querySelector(".cpk-board").className = `cpk-board cpk-board--${tier}`;
  document.querySelector(".cpk__workfoot").remove();
  const flow = document.createElement("div");
  flow.className = "cpk__flow";
  flow.innerHTML = caseName === "blank"
    ? summaryCard() + attrsCard() + realmCard()
    : summaryCard() + attrsCard() + realmCard() + equipmentCard() + inventoryCard() + skillsCard();
  document.querySelector(".cpk__content").appendChild(flow);
} else if (caseName !== "blank") {
  document.getElementById("zones").classList.remove("cpk__zones--single");
  document.getElementById("foot").textContent = "已启用 6 / 10 个模块 · 还有 4 个可开";
} else {
  document.getElementById("zones").classList.add("cpk__zones--single");
  document.getElementById("foot").textContent = "已启用 3 / 10 个模块 · 还有 7 个可开";
}
</script>
</body>
</html>
